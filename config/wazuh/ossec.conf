<!--
  =============================================================================
  Home SOC Lab — Wazuh Manager Configuration (ossec.conf)
  =============================================================================
  This is the main Wazuh Manager configuration file.

  Key sections:
    • Global settings & email alerts
    • Syslog output (to indexer)
    • Syslog listener (receive from network devices & log replay)
    • Remote agent connections
    • AWS S3 integration (disabled by default)
    • Log collection (Windows + Linux + custom JSON)
    • File Integrity Monitoring (syscheck)
    • Vulnerability detection
    • Active Response
    • Rootcheck
    • Auth (agent enrollment)
    • Cluster (disabled — single node)
    • Ruleset (includes custom rules directory)

  Reference: https://documentation.wazuh.com/current/user-manual/reference/ossec-conf/
  =============================================================================
-->

<ossec_config>

  <!-- =======================================================================
       GLOBAL SETTINGS
       ======================================================================= -->
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>
    <!-- Email alerts — disabled for lab; enable and configure SMTP for production -->
    <email_notification>no</email_notification>
    <!-- White-listed IPs excluded from active response blocking -->
    <white_list>127.0.0.1</white_list>
    <white_list>^localhost.localdomain$</white_list>
    <white_list>10.0.0.0/8</white_list>
    <white_list>172.16.0.0/12</white_list>
    <white_list>192.168.0.0/16</white_list>
  </global>

  <!-- =======================================================================
       ALERTS OUTPUT
       ======================================================================= -->
  <alerts>
    <log_alert_level>3</log_alert_level>
    <email_alert_level>12</email_alert_level>
  </alerts>

  <!-- =======================================================================
       SYSLOG OUTPUT — Forward alerts to the Wazuh Indexer
       ======================================================================= -->
  <syslog_output>
    <server>wazuh.indexer</server>
    <port>514</port>
    <format>json</format>
  </syslog_output>

  <!-- =======================================================================
       SYSLOG LISTENER — Receive syslog from network devices & log replay
       ======================================================================= -->
  <!--
    UDP listener: standard syslog from firewalls, routers, etc.
    TCP listener: reliable delivery for log replay scripts.
  -->
  <remote>
    <connection>syslog</connection>
    <port>514</port>
    <protocol>udp</protocol>
    <allowed-ips>0.0.0.0/0</allowed-ips>
  </remote>

  <remote>
    <connection>syslog</connection>
    <port>514</port>
    <protocol>tcp</protocol>
    <allowed-ips>0.0.0.0/0</allowed-ips>
  </remote>

  <!-- =======================================================================
       REMOTE AGENT CONNECTIONS
       ======================================================================= -->
  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <queue_size>131072</queue_size>
  </remote>

  <!-- =======================================================================
       AWS S3 INTEGRATION (wodle)
       =======================================================================
       To enable:
         1. Set "disabled" to "no" below.
         2. Populate AWS_CLOUDTRAIL_BUCKET and AWS_GUARDDUTY_BUCKET in .env.
         3. Mount AWS credentials into the manager container, or use an
            IAM instance role / IRSA if running on AWS.
         4. Restart the manager: docker compose restart wazuh.manager

       Docs: https://documentation.wazuh.com/current/amazon/index.html
  -->
  <wodle name="aws-s3">
    <disabled>yes</disabled>
    <interval>30m</interval>
    <run_on_start>yes</run_on_start>
    <skip_on_error>yes</skip_on_error>

    <!-- CloudTrail — API activity logging -->
    <bucket type="cloudtrail">
      <name>your-cloudtrail-bucket</name>
      <!-- <aws_profile>default</aws_profile> -->
      <!-- <path>AWSLogs/</path> -->
    </bucket>

    <!-- GuardDuty — Threat intelligence findings -->
    <bucket type="guardduty">
      <name>your-guardduty-bucket</name>
      <!-- <aws_profile>default</aws_profile> -->
      <!-- <path>AWSLogs/</path> -->
    </bucket>
  </wodle>

  <!-- =======================================================================
       LOG COLLECTION — Windows Event Channels (agent-side)
       =======================================================================
       These <localfile> blocks are pushed to Windows agents via shared config
       or centralized configuration (agent.conf). They are included here as
       the canonical reference.
  -->

  <!-- Windows Security Event Log -->
  <localfile>
    <log_format>eventchannel</log_format>
    <location>Security</location>
  </localfile>

  <!-- Sysmon/Operational — requires Sysmon installed on endpoints -->
  <localfile>
    <log_format>eventchannel</log_format>
    <location>Microsoft-Windows-Sysmon/Operational</location>
  </localfile>

  <!-- PowerShell Script Block Logging -->
  <localfile>
    <log_format>eventchannel</log_format>
    <location>Microsoft-Windows-PowerShell/Operational</location>
  </localfile>

  <!-- Windows System Event Log -->
  <localfile>
    <log_format>eventchannel</log_format>
    <location>System</location>
  </localfile>

  <!-- =======================================================================
       LOG COLLECTION — Linux Logs (manager or agent-side)
       ======================================================================= -->

  <!-- Authentication logs (Debian/Ubuntu) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <!-- General syslog -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <!-- Active Response logs -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs/active-responses.log</location>
  </localfile>

  <!-- =======================================================================
       LOG COLLECTION — Custom JSON Logs (Log Replay)
       =======================================================================
       Drop JSON log files into /var/log/custom/ on the manager for replay.
       Each line should be a valid JSON object.
  -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/custom/*.json</location>
    <label key="log_type">custom_json</label>
  </localfile>

  <!-- =======================================================================
       FILE INTEGRITY MONITORING (syscheck)
       =======================================================================
       Monitors critical system files for changes. Real-time monitoring is
       enabled for high-value files. Full scans run every 12 hours.
  -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>

    <!-- Linux directories to monitor -->
    <directories check_all="yes" report_changes="yes">/etc</directories>
    <directories check_all="yes">/usr/bin</directories>
    <directories check_all="yes">/usr/sbin</directories>
    <directories check_all="yes">/boot</directories>

    <!-- Real-time monitoring for high-value configuration files -->
    <directories check_all="yes" realtime="yes">/etc/crontab</directories>
    <directories check_all="yes" realtime="yes">/etc/cron.d</directories>
    <directories check_all="yes" realtime="yes">/etc/ssh/sshd_config</directories>

    <!-- Directories to ignore (reduce noise) -->
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <ignore>/etc/mail/statistics</ignore>
    <ignore>/etc/random-seed</ignore>
    <ignore>/etc/random.seed</ignore>
    <ignore>/etc/adjtime</ignore>
    <ignore>/etc/prelink.cache</ignore>

    <!-- Skip NFS-mounted filesystems -->
    <skip_nfs>yes</skip_nfs>
    <skip_dev>yes</skip_dev>
    <skip_proc>yes</skip_proc>
    <skip_sys>yes</skip_sys>
  </syscheck>

  <!-- =======================================================================
       VULNERABILITY DETECTION
       =======================================================================
       Scans installed packages against CVE databases. Requires agents to
       report their package inventory (syscollector).
  -->
  <vulnerability-detector>
    <enabled>yes</enabled>
    <interval>5m</interval>
    <min_full_scan_interval>6h</min_full_scan_interval>
    <run_on_start>yes</run_on_start>

    <!-- National Vulnerability Database -->
    <provider name="nvd">
      <enabled>yes</enabled>
      <update_interval>1h</update_interval>
    </provider>

    <!-- Canonical (Ubuntu) -->
    <provider name="canonical">
      <enabled>yes</enabled>
      <os>focal</os>
      <os>jammy</os>
      <os>noble</os>
      <update_interval>1h</update_interval>
    </provider>

    <!-- Debian -->
    <provider name="debian">
      <enabled>yes</enabled>
      <os>bullseye</os>
      <os>bookworm</os>
      <update_interval>1h</update_interval>
    </provider>

    <!-- Red Hat / CentOS -->
    <provider name="redhat">
      <enabled>yes</enabled>
      <os>7</os>
      <os>8</os>
      <os>9</os>
      <update_interval>1h</update_interval>
    </provider>

    <!-- Microsoft Windows -->
    <provider name="msu">
      <enabled>yes</enabled>
      <update_interval>1h</update_interval>
    </provider>
  </vulnerability-detector>

  <!-- =======================================================================
       ACTIVE RESPONSE
       =======================================================================
       Automated response actions. The firewall-drop command blocks offending
       IPs via iptables/ipset for the specified timeout.

       Rule 100301 = Custom SSH brute-force detection (see rules/custom/).
  -->
  <command>
    <name>firewall-drop</name>
    <executable>firewall-drop</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <active-response>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>100301</rules_id>
    <timeout>600</timeout>
  </active-response>

  <!-- =======================================================================
       ROOTCHECK — Rootkit Detection
       ======================================================================= -->
  <rootcheck>
    <disabled>no</disabled>
    <check_files>yes</check_files>
    <check_trojans>yes</check_trojans>
    <check_dev>yes</check_dev>
    <check_sys>yes</check_sys>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_if>yes</check_if>
    <frequency>43200</frequency>
    <rootkit_files>etc/rootcheck/rootkit_files.txt</rootkit_files>
    <rootkit_trojans>etc/rootcheck/rootkit_trojans.txt</rootkit_trojans>
  </rootcheck>

  <!-- =======================================================================
       AUTH — Agent Enrollment (authd)
       ======================================================================= -->
  <auth>
    <disabled>no</disabled>
    <port>1515</port>
    <use_source_ip>yes</use_source_ip>
    <purge>yes</purge>
    <use_password>no</use_password>
    <ssl_verify_host>no</ssl_verify_host>
    <ssl_manager_cert>etc/sslmanager.cert</ssl_manager_cert>
    <ssl_manager_key>etc/sslmanager.key</ssl_manager_key>
    <ssl_auto_negotiate>no</ssl_auto_negotiate>
  </auth>

  <!-- =======================================================================
       CLUSTER — Disabled (single-node lab deployment)
       =======================================================================
       To scale to multi-node, enable and configure node_name, node_type,
       key, and nodes list. See Wazuh clustering documentation.
  -->
  <cluster>
    <name>wazuh</name>
    <node_name>node01</node_name>
    <node_type>master</node_type>
    <key>01234567890123456789012345678901</key>
    <port>1516</port>
    <bind_addr>0.0.0.0</bind_addr>
    <nodes>
      <node>wazuh.manager</node>
    </nodes>
    <hidden>no</hidden>
    <disabled>yes</disabled>
  </cluster>

  <!-- =======================================================================
       RULESET — Rules & Decoders
       =======================================================================
       The <rule_dir> directive loads all .xml files from the custom directory.
       Place your detection rules in rules/custom/ (mounted via docker-compose).
  -->
  <ruleset>
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <rule_dir>etc/rules/custom</rule_dir>
    <list>etc/lists/audit-keys</list>
    <list>etc/lists/amazon/aws-eventnames</list>
    <list>etc/lists/security-eventchannel</list>
    <!-- Custom CDB lists -->
    <list>etc/lists/custom/malicious_ips.txt</list>

    <!-- Default rule/decoder exclusions (uncomment if needed) -->
    <!-- <rule_exclude>0215-policy_rules.xml</rule_exclude> -->
    <!-- <decoder_exclude>0050-if_sid_decoders.xml</decoder_exclude> -->
  </ruleset>

  <!-- =======================================================================
       SYSCOLLECTOR — System Inventory
       =======================================================================
       Collects OS info, packages, ports, processes, and hardware for
       vulnerability detection and compliance checks.
  -->
  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware>
    <os>yes</os>
    <network>yes</network>
    <packages>yes</packages>
    <ports all="no">yes</ports>
    <processes>yes</processes>
    <hotfixes>yes</hotfixes>
  </wodle>

</ossec_config>
